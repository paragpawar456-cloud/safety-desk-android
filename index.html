<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛑️</text></svg>">
<title>Site Safety Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark site-office sidebar + concrete-grey work surface; hi-vis amber as the one accent. */
:root{
  --bg:#f2f4f8; --panel:#ffffff; --sunk:#f6f8fb; --ink:#16202e; --muted:#5e6b7a; --line:#e1e6ec;
  --accent:#ffb300; --accent-ink:#0d2a4a; --accent-soft:#fff4d6;
  --nav:#0d2a4a; --nav2:#1b4f86; --nav-ink:#c9d6e8; --nav-hi:#ffffff; --shadow:0 1px 2px #0d2a4a14,0 4px 14px #0d2a4a12;
  --low:#2e8b57; --med:#b67d00; --high:#d35f17; --crit:#c62828; --ok:#2e8b57;
  --low-bg:#e5f4ea; --med-bg:#fbf0d4; --high-bg:#fde6d8; --crit-bg:#fbe0e0;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --panel:#1a1d21; --sunk:#15171a; --ink:#e8ebef; --muted:#9aa3ae; --line:#2c3138;
  --accent:#ffb81f; --accent-ink:#1d1600; --accent-soft:#3a2e0e;
  --nav:#0a1626; --nav2:#12345a; --nav-ink:#aab8ca; --nav-hi:#ffffff; --shadow:0 1px 2px #0006,0 4px 14px #0004;
  --low:#5cc58a; --med:#e3a82a; --high:#f08a4b; --crit:#ff6b6b; --ok:#5cc58a;
  --low-bg:#183224; --med-bg:#352a0e; --high-bg:#3a2214; --crit-bg:#3d1a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --panel:#1a1d21; --sunk:#15171a; --ink:#e8ebef; --muted:#9aa3ae; --line:#2c3138;
  --accent:#ffb81f; --accent-ink:#1d1600; --accent-soft:#3a2e0e;
  --nav:#0a1626; --nav2:#12345a; --nav-ink:#aab8ca; --nav-hi:#ffffff; --shadow:0 1px 2px #0006,0 4px 14px #0004;
  --low:#5cc58a; --med:#e3a82a; --high:#f08a4b; --crit:#ff6b6b; --ok:#5cc58a;
  --low-bg:#183224; --med-bg:#352a0e; --high-bg:#3a2214; --crit-bg:#3d1a1a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:0 24px}
.brand{padding:18px 18px 14px;border-bottom:1px solid #ffffff14}
.brand .stripe{height:6px;margin:-18px -18px 14px;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,var(--nav) 9px 18px)}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.01em;color:var(--nav-hi);text-transform:uppercase}
.brand small{font-size:12px;opacity:.75}
.navgrp{padding:14px 10px 0}
.navgrp h6{margin:0 8px 6px;font:600 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:7px 10px;color:var(--nav-ink);cursor:pointer;font-size:13.5px}
.nav button:hover{background:#ffffff10;color:var(--nav-hi)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav .cnt{font:500 11px var(--f-mono);background:#ffffff1c;border-radius:10px;padding:0 7px}
.nav button[aria-current="page"] .cnt{background:#0000001f}
main{min-width:0;padding-inline:28px;padding-block:0 48px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;text-wrap:balance;flex:1 1 auto}
.top .site{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.on i{background:var(--ok)}
.chip.warn i{background:var(--med)}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.mono{white-space:nowrap}
a{color:inherit;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel.flat{background:var(--sunk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font:700 26px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ai::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.btn.pri.ai::before{background:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
textarea.big{min-height:180px;font-family:var(--f-mono);font-size:12.5px}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--sunk);font-weight:600}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td select{padding:3px 6px;font-size:12.5px;width:auto}
.sev{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 7px;white-space:nowrap}
.sev.Low{background:var(--low-bg);color:var(--low)}
.sev.Medium{background:var(--med-bg);color:var(--med)}
.sev.High{background:var(--high-bg);color:var(--high)}
.sev.Critical,.sev.Very{background:var(--crit-bg);color:var(--crit)}
.st{font-size:11.5px;font-weight:600}
.st.Open,.st.Non-compliant{color:var(--crit)} .st.Closed,.st.Compliant{color:var(--ok)} .st.Partial,.st.In{color:var(--med)}
.ex{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--muted);border-radius:3px;padding:0 4px;margin-left:4px}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--crit)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbars .r{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.hbars .t{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbars .t i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .b{flex:1;min-width:0}
.out{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;overflow-wrap:anywhere}
.out:empty{display:none}
.out h1,.out h2,.out h3,.out h4{font-family:var(--f-display);margin:12px 0 6px;font-size:15px}
.out h1{font-size:18px}
.out ul,.out ol{margin:4px 0 8px;padding-left:20px}
.out table{margin:8px 0;background:var(--panel)}
.out .tw{margin:8px 0}
.think{color:var(--muted);font-style:italic}
.law{font-size:12.5px;padding:6px 0 6px 12px;border-left:3px solid var(--accent);margin:4px 0}
.vcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.vcard + .vcard{margin-top:10px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--sunk);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.drop img{max-height:260px;border-radius:4px;margin-top:8px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 13px;border-radius:10px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft)}
.msg.a{align-self:flex-start;background:var(--sunk);border:1px solid var(--line)}
.rm{display:inline-block;min-width:26px;text-align:center;border-radius:3px;font:600 12px var(--f-mono);padding:1px 4px}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:20;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;padding:0;display:flex;overflow-x:auto;align-items:stretch}
  .brand{flex:none;border:0;padding:10px 14px}
  .brand .stripe{display:none}
  .brand b{font-size:15px}
  .brand small{display:none}
  .navgrp{display:flex;padding:6px 4px;gap:2px;flex:none}
  .navgrp h6{display:none}
  .nav button{white-space:nowrap;width:auto}
  .nav .cnt{display:none}
  main{padding-inline:16px}
  .hbars .r{grid-template-columns:96px minmax(0,1fr) 30px}
}

/* ---- v2 look: navy + safety amber, icons, motion ---- */
.nav{background:linear-gradient(180deg,var(--nav),var(--nav2))}
.nav .ni{font-style:normal;display:inline-block;width:22px;margin-right:6px;text-align:center}
.nav button{transition:background .15s,transform .15s}
.nav button:hover{transform:translateX(2px)}
.brand .stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#1b1b1b 10px 20px)}
.top{border-bottom:0;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#1b1b1b 10px 20px);opacity:.9}
.panel,.kpi,.tw,.vcard{border-color:transparent;box-shadow:var(--shadow)}
.kpi{border-radius:16px;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px)}
.kpi.alert{border-color:var(--crit);box-shadow:var(--shadow),inset 4px 0 0 var(--crit)}
.btn{border-radius:10px;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--accent),#ffc94d);box-shadow:0 2px 6px #ffb30055}
#view>*{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:22px 24px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--nav),var(--nav2));box-shadow:var(--shadow)}
.hero h2{color:#fff;font-size:22px;margin:0 0 4px}
.hero p{margin:0 0 4px;color:#c9d6e8}
.hero .big{font-size:58px;line-height:1}
.pill{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;font-weight:600;font-size:12.5px}
.pill.good{background:#c8f2d4;color:#0b5d2a}.pill.bad{background:#ffd6d6;color:#7a1010}
.tip{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.tip:hover{transform:translateY(-2px)}
.tip.mand{border-color:#1565c055}.tip.warn{border-color:#ffc40088}.tip.proh,.tip.fire{border-color:#d32f2f55}.tip.safe{border-color:#2e7d3255}
.tip .b{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-width:0}
.tip .lbl{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tip .msg{font-size:15px;color:var(--ink)}
.sign{flex:none;width:58px;height:58px;display:grid;place-items:center;font-size:25px;position:relative}
.sign.mand{background:#1565c0;border-radius:50%}
.sign.safe{background:#2e7d32;border-radius:10px}.sign.fire{background:#d32f2f;border-radius:10px}
.sign.warn{background:#1b1b1b;clip-path:polygon(50% 2%,100% 96%,0 96%)}
.sign.warn::before{content:"";position:absolute;inset:0;background:#ffc400;clip-path:polygon(50% 14%,90% 90%,10% 90%)}
.sign.warn span{position:relative;top:7px;font-size:20px}
.sign.proh{background:#fff;border:6px solid #d32f2f;border-radius:50%}
.sign.proh::after{content:"";position:absolute;width:6px;height:120%;background:#d32f2f;transform:rotate(45deg);border-radius:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--panel);border:0;border-radius:16px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;animation:up .35s ease both;animation-delay:calc(var(--i,0) * 40ms)}
.tile:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0d2a4a22}
.tile b{font-family:var(--f-display);font-size:15px}
.tile .ico{font-size:24px;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--accent-soft);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <nav class="nav" id="nav" aria-label="Modules"></nav>
  <main>
    <header class="top">
      <h1 id="ttl">Dashboard</h1>
      <span class="site" id="siteLine"></span>
      <span class="chip" id="storeChip"><i></i><span>Saved in this browser</span></span>
      <span class="chip" id="aiChip"><i></i><span>Claude: connecting</span></span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="toast" hidden></div>
<script>
// ---------- Legal reference library (India) ----------
// Section numbers are given only where well established. Always verify against the
// currently notified text and the State's own BOCW / OSH rules before citing in a notice.
const LAW = {
  B7:   'BOCW Act 1996 s.7 – registration of establishment before work starts',
  B32:  'BOCW Act 1996 ss.32–37 – drinking water, latrines & urinals, accommodation, crèche, first-aid, canteen',
  B36:  'BOCW Act 1996 s.36 – first-aid boxes equipped with prescribed contents',
  B38:  'BOCW Act 1996 s.38 – safety committee and safety officers (500+ building workers)',
  B39:  'BOCW Act 1996 s.39 – notice of accidents causing death or injury preventing work for 48 hours or more',
  B40:  'BOCW Act 1996 s.40 – safety and health measures as prescribed by the Central/State Rules',
  B44:  'BOCW Act 1996 s.44 – employer responsible for adequate supervision and safety of every worker',
  B46:  'BOCW Act 1996 s.46 – notice of commencement and completion of work (30 days before start)',
  B47:  'BOCW Act 1996 s.47 – penalty for contravening safety provisions: up to 3 months imprisonment and/or ₹2,000 fine, ₹100/day if continued',
  BR_PPE:  'BOCW Central Rules 1998 – personal protective equipment: helmets, safety footwear, gloves, goggles, harness to be provided and used',
  BR_HT:   'BOCW Central Rules 1998 – work at height: guard-rails & toe-boards at open edges, covers on openings, safety nets/harness where guarding is impracticable',
  BR_SC:   'BOCW Central Rules 1998 – scaffolds: erected by competent person, sound material, guard-rails, toe-boards, working platforms, inspected before use',
  BR_LAD:  'BOCW Central Rules 1998 – ladders: sound construction, secured, extend at least 1 m above landing',
  BR_EX:   'BOCW Central Rules 1998 – excavation & tunnelling: shoring/sloping, barricades, safe access, spoil kept clear of edge, daily inspection',
  BR_EL:   'BOCW Central Rules 1998 – electrical safety at site: insulated cables, protected distribution boards, earthing, earth-leakage protection',
  BR_LIFT: 'BOCW Central Rules 1998 – lifting appliances & gear: tested and examined by competent person, SWL marked, certified operators, signaller',
  BR_FIRE: 'BOCW Central Rules 1998 – fire protection: extinguishers, fire watchers, hot-work precautions',
  BR_HK:   'BOCW Central Rules 1998 – stacking of materials, housekeeping and disposal of debris',
  BR_VEH:  'BOCW Central Rules 1998 – transport & earth-moving equipment: trained drivers, reversing alarms, banksman/signaller',
  BR_CS:   'BOCW Central Rules 1998 – confined spaces: gas testing, ventilation, permit, standby person',
  BR_DEM:  'BOCW Central Rules 1998 – demolition: planned sequence, competent supervision, exclusion zone',
  BR_FW:   'BOCW Central Rules 1998 – formwork & concreting: designed props, inspection before and during pour',
  BR_MED:  'BOCW Central Rules 1998 – medical examination of workers and occupational health surveillance',
  BR_LIGHT:'BOCW Central Rules 1998 – adequate lighting at workplaces, passages and stairs',
  OSH6:  'OSH Code 2020 s.6 – employer duty to keep the workplace free from hazards that cause or are likely to cause injury',
  OSH10: 'OSH Code 2020 s.10 – notice of accidents and dangerous occurrences',
  OSHC:  'OSH Code 2020 – safety committee and safety officers (applies as your State notifies its rules)',
  FA:    'Factories Act 1948 – applies to batching plants, precast yards and workshops registered as factories (s.7A general duties, s.88 notice of accident)',
  NBC7:  'National Building Code 2016, Part 7 – Constructional Practices and Safety',
  NBC4:  'National Building Code 2016, Part 4 – Fire and Life Safety',
  CEA:   'CEA (Measures relating to Safety and Electric Supply) Regulations 2023',
  GCR:   'Gas Cylinder Rules 2016 (PESO) – storage, handling, upright and secured cylinders',
  EXR:   'Explosives Rules 2008 – licensed blasting, shot-firer, exclusion zone',
  CLRA:  'Contract Labour (R&A) Act 1970 – s.7 principal employer registration, s.12 contractor licence',
  CHILD: 'Child and Adolescent Labour (Prohibition & Regulation) Act 1986 – no child below 14; no adolescent (14–18) in hazardous occupations including construction',
  EC:    'Employees’ Compensation Act 1923 – compensation for injury or death arising out of employment',
  CDW:   'Construction & Demolition Waste Management Rules 2016',
  CESS:  'BOCW Welfare Cess Act 1996 – cess at 1% of cost of construction',

// ================= Core =================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoD(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return isoD(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const fmtD = s => s ? String(s).slice(0, 10).split('-').reverse().join('-') : '';
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const num = v => Number(v) || 0;
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const risk = (l, s) => num(l) * num(s);
const band = r => r >= 16 ? 'Critical' : r >= 10 ? 'High' : r >= 5 ? 'Medium' : 'Low';

// ================= Markdown-lite renderer for Claude output =================
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let out = '', list = null, tbl = null;
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  const closeTbl = () => { if (tbl) { out += '<div class="tw"><table>' + tbl.map((r, i) => '<tr>' + r.map(c => i === 0 ? `<th>${inl(c)}</th>` : `<td>${inl(c)}</td>`).join('') + '</tr>').join('') + '</table></div>'; tbl = null; } };
  for (const raw of lines) {
    const l = raw.trim(); let m;
    if (/^\|.*\|$/.test(l)) { closeList(); const cells = l.slice(1, -1).split('|').map(c => c.trim()); if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue; (tbl ||= []).push(cells); continue; }
    closeTbl();
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeList(); const n = Math.min(m[1].length + 1, 4); out += `<h${n}>${inl(m[2])}</h${n}>`; continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/))) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${inl(m[1])}</li>`; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${inl(m[1])}</li>`; continue; }
    closeList(); if (l) out += `<p>${inl(l)}</p>`;
  }
  closeList(); closeTbl(); return out;
}

// ================= Derived data =================
function escalations() {
  const out = [], t = today();
  for (const r of recs('obs')) {
    if (r.status === 'Closed') continue;
    const age = daysBetween(r.date || t, t);
    if (r.sev === 'Critical') out.push({ lvl: 'L3', id: r.id, what: 'Critical observation open', detail: r.obs, loc: r.location, since: r.date, ref: r });
    else if (r.sev === 'High' && age >= 2) out.push({ lvl: 'L2', id: r.id, what: `High-risk observation open ${age} days`, detail: r.obs, loc: r.location, since: r.date, ref: r });
    else if (r.target && r.target < t) out.push({ lvl: 'L2', id: r.id, what: `Corrective action overdue by ${daysBetween(r.target, t)} days`, detail: r.obs, loc: r.location, since: r.target, ref: r });
  }
  for (const r of recs('incident')) {
    if (r.status === 'Closed') continue;
    if (['Fatal', 'Lost time injury', 'Dangerous occurrence'].includes(r.type)) out.push({ lvl: 'L4', id: r.id, what: r.type + ' reported', detail: r.desc, loc: r.location, since: r.date, ref: r });
    else if (r.type === 'Medical treatment case' || r.type === 'Fire') out.push({ lvl: 'L3', id: r.id, what: r.type + ' under investigation', detail: r.desc, loc: r.location, since: r.date, ref: r });
    if (r.notified === 'Pending') out.push({ lvl: 'L3', id: r.id + ':n', what: 'Statutory accident notice pending', detail: r.desc, loc: r.location, since: r.date, ref: r });
  }
  for (const c of COMPLIANCE) {
    const r = S.recs.get('cmp_' + c.code);
    if (r?.status === 'Non-compliant') out.push({ lvl: 'L3', id: r.id, what: 'Statutory non-compliance', detail: c.item, loc: '', since: r.due || '', ref: r });
    else if (r?.due && r.due < t && r.status !== 'Compliant' && r.status !== 'Not applicable') out.push({ lvl: 'L2', id: r.id, what: 'Compliance due date passed', detail: c.item, loc: '', since: r.due, ref: r });
  }
  for (const r of recs('pr')) {
    if (r.status === 'Submitted' && r.urgency !== 'Normal' && daysBetween(r.date, t) >= 2) out.push({ lvl: 'L2', id: r.id, what: `${r.urgency} PR awaiting approval ${daysBetween(r.date, t)} days`, detail: `${r.item} × ${r.qty} ${r.unit || ''}`, loc: '', since: r.date, ref: r });
  }
  return out.sort((a, b) => b.lvl.localeCompare(a.lvl));
}
function stats(from, to) {
  const inR = r => (!from || r.date >= from) && (!to || r.date <= to);
  const obs = recs('obs').filter(inR), inc = recs('incident').filter(inR), tr = recs('training').filter(inR);
  const meet = recs('meeting').filter(inR), cost = recs('cost').filter(inR), pr = recs('pr').filter(inR);
  const byCat = {}; obs.forEach(o => byCat[o.cat || 'General'] = (byCat[o.cat || 'General'] || 0) + 1);
  const bySev = {}; SEVS.forEach(s => bySev[s] = obs.filter(o => o.sev === s).length);
  const trainHrs = tr.filter(t => t.status !== 'Planned').reduce((a, t) => a + num(t.participants) * num(t.hours), 0);
  return { obs, inc, tr, meet, cost, pr, byCat, bySev, trainHrs, closed: obs.filter(o => o.status === 'Closed').length,
    spend: cost.reduce((a, c) => a + num(c.amount), 0) };
}
function complianceScore() {
  let ok = 0, n = 0;
  for (const c of COMPLIANCE) { const st = S.recs.get('cmp_' + c.code)?.status; if (st === 'Not applicable') continue; n++; if (st === 'Compliant') ok++; else if (st === 'Partial') ok += .5; }
  return n ? Math.round(ok / n * 100) : 0;
}
function safetyNumbers() {
  const s = S.settings, mh = num(s.manHours);
  const ltis = recs('incident').filter(r => ['Lost time injury', 'Fatal'].includes(r.type));
  const lastLTI = [s.lastLTI, ...ltis.map(r => r.date)].filter(Boolean).sort().pop();
  const daysLost = recs('incident').reduce((a, r) => a + num(r.daysLost), 0);
  return { mh, lti: ltis.length, ltifr: mh ? (ltis.length * 1e6 / mh) : null, sr: mh ? (daysLost * 1e6 / mh) : null,
    sinceLTI: lastLTI ? daysBetween(lastLTI, today()) : null, lastLTI };
}

const KW = [
  ['Work at height', /harness|height|edge|parapet|lanyard|lifeline|fall arrest/i], ['Scaffolding', /scaffold|plank|cuplock|staging/i],
  ['Openings & barricading', /opening|shaft|barricad|cut.?out|duct|railing/i], ['Excavation', /excavat|trench|pit|shoring|cave/i],
  ['Electrical', /electric|wire|cable|\bdb\b|elcb|rccb|earthing|shock|panel|plug/i], ['Hot work & fire', /weld|cutting|gas|cylinder|fire|extinguish|grind/i],
  ['Lifting & cranes', /crane|hydra|sling|lifting|hook|rigging|tower crane|chain pulley/i], ['Vehicles & plant', /dumper|jcb|vehicle|revers|transit|tipper|excavator|banksman/i],
  ['PPE', /helmet|shoe|glove|goggle|ppe|jacket|mask|ear ?plug/i], ['Housekeeping', /housekeep|debris|material|stack|nail|rebar|scrap|waste/i],
  ['Formwork & concreting', /shutter|formwork|prop|concret|pour/i], ['Confined space', /confined|manhole|tank|septic|sump/i],
  ['Welfare & health', /water|toilet|first.?aid|drink|creche|labour camp|medical/i], ['Environment', /dust|noise|smoke|spill/i]];
const ruleCat = t => (KW.find(([, re]) => re.test(t)) || ['General'])[0];
const ruleSev = t => /no harness|without harness|shaft|live wire|collapse|cave|fatal|critical|danger|बिना हार्नेस/i.test(t) ? 'Critical' : /harness|height|edge|electric|crane|excavat|fire|gas|scaffold/i.test(t) ? 'High' : /helmet|shoe|ppe|housekeep/i.test(t) ? 'Medium' : 'Low';
function parseWhatsAppRules(text) {
  const re = /^\[?(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4}),?\s+(\d{1,2}:\d{2})(?::\d{2})?\s*([ap]\.?m\.?)?\]?\s*[-–]?\s*([^:]{1,40}):\s*(.*)$/i;
  const msgs = [];
  for (const line of text.replace(/\r/g, '').split('\n')) {
    const m = line.match(re);
    if (m) { let y = m[3]; if (y.length === 2) y = '20' + y; msgs.push({ date: `${y}-${pad(m[2])}-${pad(m[1])}`, time: m[4], who: m[6].trim(), text: m[7] }); }
    else if (msgs.length && line.trim()) msgs[msgs.length - 1].text += ' ' + line.trim();
  }
  if (!msgs.length) text.split(/\n\s*\n|\n/).filter(x => x.trim().length > 8).forEach(x => msgs.push({ date: today(), time: '', who: '', text: x.trim() }));
  return msgs.filter(m => m.text && !/<media omitted>|image omitted|joined using|left$|added|deleted this message|security code|end-to-end encrypted/i.test(m.text) && m.text.length > 8)
    .map(m => ({ date: m.date, time: m.time, reportedBy: m.who, location: (m.text.match(/(tower|block|wing|floor|slab|level|basement|podium|gate|core|grid)\s*[\w-]*(\s*(floor|slab|level))?/i) || [''])[0],
      obs: m.text, cat: ruleCat(m.text), sev: ruleSev(m.text), action: '', responsible: '', pick: true }));
}

// ---------- Photo check ----------
async function shrink(file, max = 480, q = .65) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

// ---------- Reports ----------
function periodRange(kind) {
  const t = today(), d = new Date();
  if (kind === 'Daily') return [t, t];
  if (kind === 'Weekly') return [addDays(t, -6), t];
  if (kind === 'Monthly') return [isoD(new Date(d.getFullYear(), d.getMonth(), 1)), t];
  return [S.ui.rFrom || addDays(t, -6), S.ui.rTo || t];
}
function buildReport(kind) {
  const [from, to] = periodRange(kind), st = stats(from, to), n = safetyNumbers(), s = S.settings;
  const openHi = recs('obs').filter(r => r.status !== 'Closed' && (r.sev === 'High' || r.sev === 'Critical'));
  const comp = COMPLIANCE.map(c => ({ ...c, st: S.recs.get('cmp_' + c.code)?.status || 'Not assessed' })).filter(c => c.st !== 'Compliant' && c.st !== 'Not applicable');
  return { kind, from, to, st, n, s, openHi, comp, esc: escalations() };
}
function reportBody(R, forFile) {
  const { st, n, s } = R, rows = (arr, f) => arr.map(f).join('');
  const sec = (t, b) => `<h2>${t}</h2>${b}`;
  const tbl = (h, body) => `<div class="tw"><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${body}</table></div>`;
  return `${forFile ? '' : ''}<h1>${R.kind} Safety Report</h1>
  <p><b>${esc(s.siteName || 'Site')}</b>${s.location ? ', ' + esc(s.location) : ''} · Period ${fmtD(R.from)}${R.from !== R.to ? ' to ' + fmtD(R.to) : ''}<br>Client: ${esc(s.client || '-')} · Contractor: ${esc(s.contractor || '-')} · Workers on site: ${esc(s.workers || '-')}</p>
  ${R.summary ? sec('Executive summary', md(R.summary)) : ''}
  ${sec('Key safety statistics', tbl(['Indicator', 'Value'], [
    ['Safe man-hours to date', n.mh ? n.mh.toLocaleString('en-IN') : '-'], ['Days since last LTI', n.sinceLTI ?? '-'], ['LTIFR (per 10⁶ man-hours, IS 3786)', n.ltifr != null ? n.ltifr.toFixed(2) : '-'],
    ['Observations raised / closed', `${st.obs.length} / ${st.closed}`], ['Incidents in period', st.inc.length], ['Training sessions / man-hours', `${st.tr.length} / ${Math.round(st.trainHrs)}`],
    ['Meetings held', st.meet.length], ['Safety spend in period', inr(st.spend)], ['Statutory compliance score', complianceScore() + '%']].map(([a, b]) => `<tr><td>${a}</td><td class="num">${b}</td></tr>`).join('')))}
  ${sec('Observations by category', st.obs.length ? tbl(['Category', 'Count'], rows(Object.entries(st.byCat).sort((a, b) => b[1] - a[1]), ([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`)) + `<p>${SEVS.map(x => `${x}: ${st.bySev[x]}`).join(' · ')}</p>` : '<p>No observations in this period.</p>')}
  ${sec('Observation register', st.obs.length ? tbl(['Date', 'Location', 'Observation', 'Severity', 'Action / responsible', 'Status'], rows(st.obs, r => `<tr><td>${fmtD(r.date)}</td><td>${esc(r.location)}</td><td>${esc(r.obs)}</td><td>${esc(r.sev)}</td><td>${esc(r.action)}${r.responsible ? ' – ' + esc(r.responsible) : ''}</td><td>${esc(r.status)}</td></tr>`)) : '<p>None.</p>')}
  ${sec('Open high-risk items (all dates)', R.openHi.length ? tbl(['Raised', 'Location', 'Observation', 'Severity', 'Target'], rows(R.openHi, r => `<tr><td>${fmtD(r.date)}</td><td>${esc(r.location)}</td><td>${esc(r.obs)}</td><td>${esc(r.sev)}</td><td>${fmtD(r.target)}</td></tr>`)) : '<p>None open.</p>')}
  ${sec('Incidents', st.inc.length ? tbl(['Date', 'Type', 'Location', 'Description', 'Status'], rows(st.inc, r => `<tr><td>${fmtD(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.location)}</td><td>${esc(r.desc)}</td><td>${esc(r.status)}</td></tr>`)) : '<p>No incidents reported in this period.</p>')}
  ${sec('Training & toolbox talks', st.tr.length ? tbl(['Date', 'Type', 'Topic', 'Participants', 'Hours'], rows(st.tr, r => `<tr><td>${fmtD(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.topic)}</td><td class="num">${esc(r.participants)}</td><td class="num">${esc(r.hours)}</td></tr>`)) : '<p>None recorded.</p>')}
  ${sec('Statutory items needing action', R.comp.length ? tbl(['Requirement', 'Reference', 'Status'], rows(R.comp, c => `<tr><td>${esc(c.item)}</td><td>${esc(L(c.law))}</td><td>${esc(c.st)}</td></tr>`)) : '<p>All tracked items compliant.</p>')}
  ${sec('Escalations open', R.esc.length ? tbl(['Level', 'Issue', 'Detail'], rows(R.esc, e => `<tr><td>${e.lvl}</td><td>${esc(e.what)}</td><td>${esc(e.detail)}</td></tr>`)) : '<p>None.</p>')}
  <p style="margin-top:24px">Prepared by: ____________________ (Safety Officer) &nbsp;&nbsp; Reviewed by: ____________________ (Project Manager)</p>`;
}

function sopTemplate(act) {
  const rows = HIRA_LIB[act] || [];
  const laws = [...new Set(rows.map(r => r.law))];
  return `# Standard Operating Procedure: ${act}\n\n**Site:** ${S.settings.siteName || '-'} · **Rev:** 00 · **Date:** ${fmtD(today())}\n\n## 1. Purpose\nTo carry out ${act.toLowerCase()} safely and in line with the BOCW Act 1996, BOCW Central Rules 1998, the OSH Code 2020 and applicable IS codes.\n\n## 2. Scope\nAll employees, contractors and sub-contractors engaged in ${act.toLowerCase()} at this site.\n\n## 3. Responsibilities\n- **Project manager:** provide resources and approve the method statement.\n- **Site engineer / supervisor:** brief the gang, issue the work permit, supervise continuously.\n- **Safety officer:** verify controls, inspect, stop unsafe work.\n- **Workers:** follow this SOP, use PPE, report hazards.\n\n## 4. Pre-start requirements\n- Method statement and HIRA reviewed and briefed in the toolbox talk.\n- Valid work permit where applicable.\n- Competent, trained and medically fit workers.\n- Equipment inspected and tagged.\n\n## 5. Hazards and controls\n${rows.map(r => `- **${r.h}:** ${r.ctrl}.`).join('\n')}\n\n## 6. PPE\n- Safety helmet (IS 2925), safety shoes (IS 15298), hi-vis jacket, gloves; plus task-specific PPE (harness IS 3521, goggles IS 5983, respirator, ear protection).\n\n## 7. Emergency response\n- Stop work, raise alarm, give first aid, call the site ambulance / 108.\n- Inform the safety officer and site in-charge immediately; preserve the scene.\n- Report under BOCW Act s.39 where the injury prevents work for 48 hours or more.\n\n## 8. References\n${laws.map(l => '- ' + L(l)).join('\n')}\n- ${L('NBC7')}\n\n## 9. Records\nWork permit, toolbox talk attendance, inspection checklists.`;
}

// ---------- Incidents ----------
function statutory(type) {
  const serious = ['Fatal', 'Lost time injury', 'Dangerous occurrence'].includes(type);
  const out = [];
  out.push('Give first aid / medical care; preserve the scene and photographs; take witness statements.');
  if (type === 'Fatal') out.push('Inform police and the BOCW Inspector immediately (telephone/e-mail), then written notice in the prescribed form.');
  if (serious) out.push(`Send written notice of accident to the authority within the time prescribed by the State BOCW Rules – ${L('B39')}; ${L('OSH10')}.`);
  if (['Fatal', 'Lost time injury', 'Medical treatment case'].includes(type)) out.push(`Report to the insurer / ESIC and process compensation – ${L('EC')}.`);
  if (type === 'Dangerous occurrence') out.push('Notify the Inspector even if nobody was injured (collapse of scaffold, crane failure, fire, etc.).');
  out.push('Enter in the accident register; investigate (root cause, 5-Why) within 24–48 hours; share lessons learnt in toolbox talks.');
  if (serious) out.push('Escalate to Corporate EHS / management immediately (L4).');
  return out;
}

  return `<div class="panel"><h2>Ask the safety assistant</h2><p class="small muted">Ask anything: a legal requirement, a permit format, a notice to a contractor, a safety talk, an analysis of your open items. The assistant sees a summary of this site’s register.</p>
  <div class="chat" id="chat">${c.length ? c.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">${m.role === 'user' ? esc(m.content) : md(m.content)}</div>`).join('') : `<div class="muted small">Try: “Draft a warning letter to the shuttering contractor for repeated no-harness cases” or “What registers must we maintain under BOCW?”</div>`}${S.ui.chatBusy ? '<div class="msg a think" id="chatLive">Thinking…</div>' : ''}</div>
  <form class="row" data-form="chat" style="margin-top:12px;flex-wrap:nowrap"><label for="chatIn" class="muted" hidden>Message</label><textarea id="chatIn" name="m" rows="2" style="min-height:44px" placeholder="Type your question…"></textarea><button class="btn pri" type="submit" ${S.ai && !S.ui.chatBusy ? '' : 'disabled'}>Send</button></form>${aiOff()}</div>`;

function siteDigest() {
  const open = recs('obs').filter(r => r.status !== 'Closed');
  return `Site register digest: ${open.length} open observations (${SEVS.map(s => s + ' ' + open.filter(o => o.sev === s).length).join(', ')}). Top open items: ${open.slice(0, 15).map(o => `[${o.sev}] ${o.obs} @${o.location}`).join('; ')}. Incidents total: ${recs('incident').length}. Compliance score ${complianceScore()}%. Escalations pending: ${escalations().length}.`;
}
FORM.chat = async f => {
  const m = formData(f).m.trim(); if (!m || !S.ai) return;
  const c = S.ui.chat; c.push({ role: 'user', content: m }); S.ui.chatBusy = true; render();
  const lead = { role: 'user', content: GROUND + '\n' + siteCtx() + '\n' + siteDigest() + '\nAnswer the safety manager’s questions below.' };
  try {
    const { text } = await S.ai([lead, ...c.slice(-12)], { cache: false, onText: ({ text }) => { const l = $('#chatLive'); if (l) { l.classList.remove('think'); l.innerHTML = md(text); } } });
    c.push({ role: 'assistant', content: text });
  } catch (e) { c.push({ role: 'assistant', content: e.text || aiErr(e) }); }
  S.ui.chatBusy = false; render();
};

// ================= Standalone mode: Google Gemini =================
// Outside claude.ai there is no Claude runtime, so the page uses the user's own free Gemini key (kept in this browser only).
const GEM_MODELS = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest', 'gemini-2.5-flash-lite'];
const gemKey = () => { try { return localStorage.getItem('ssd.gemKey') || ''; } catch { return ''; } };
async function gemCall(contents, onText) {
  let last;
  for (const m of GEM_MODELS) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:streamGenerateContent?alt=sse`, {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': gemKey() },
      body: JSON.stringify({ contents, generationConfig: { maxOutputTokens: 32000 } }) }).catch(e => ({ ok: false, status: 0, json: async () => ({ error: { message: e.message } }) }));
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).error.message; } catch {}
      last = { code: r.status === 429 ? 'gem_limit' : 'gemini', message: `Gemini ${r.status || 'network error'}: ${msg}` };
      if ([429, 404, 503].includes(r.status)) continue;
      throw last;
    }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', text = '';
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        try { for (const p of JSON.parse(line.slice(5)).candidates?.[0]?.content?.parts || []) if (p.text && !p.thought) { text += p.text; onText?.({ text }); } } catch {}
      }
    }
    if (!text) throw { code: 'gemini', message: 'Gemini returned an empty answer.' };
    return m === GEM_MODELS[0] ? text : text + `\n\n_(Answered by ${m}: the default model was over its free limit.)_`;
  }
  throw last;
}
async function gemAI(input, o = {}) {
  let contents;
  if (Array.isArray(input)) contents = input.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
  else {
    const parts = [];
    for (const f of o.images ? [].concat(o.images) : []) parts.push({ inline_data: { mime_type: 'image/jpeg', data: (await shrink(f, 1568, .85)).split(',')[1] } });
    parts.push({ text: input }); contents = [{ role: 'user', parts }];
  }
  return { text: await gemCall(contents, o.onText) };
}
gemAI.json = async (p, o = {}) => {
  const { text } = await gemAI(p + '\nReply with JSON only, without code fences.', o);
  const m = text.match(/[\[{][\s\S]*[\]}]/); if (!m) throw { code: 'invalid_json' };
  try { return JSON.parse(m[0]); } catch { throw { code: 'invalid_json' }; }
};
function useGemini() { if (gemKey()) { S.ai = gemAI; S.imgOK = true; S.aiState = 'ready'; S.aiName = 'Gemini'; } else { S.ai = null; S.aiState = 'off'; S.aiName = ''; } }
FORM.gemKey = f => { try { localStorage.setItem('ssd.gemKey', formData(f).k.trim()); } catch {} useGemini(); toast(gemKey() ? 'Gemini key saved in this browser' : 'Key removed'); render(); };
// Plain browser download when the page is not running inside claude.ai.
async function browserSave(filename, data) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv' : /\.json$/.test(filename) ? 'application/json' : 'text/html' }));
  a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Downloaded ' + filename);
}

// ================= Boot =================
loadLocal();
render();
(async () => {
  if (!window.claude?.use) { useGemini(); render(); return; }
  const [d, sm, dl] = await Promise.all(['db', 'sample', 'downloads'].map(n => claude.use(n).catch(() => null)));
  S.ai = sm; S.dl = dl; S.aiState = sm ? 'ready' : 'off';
  if (sm) try { S.imgOK = !!(await sm.limits()).images; } catch {}
  if (d) {
    db = d; col = db.collection('records'); cfg = db.doc('config/site'); S.mode = 'db';
    S.recs = new Map();
    col.onSnapshot(snap => { S.recs = new Map(snap.docs.map(x => [x.id, { ...x.data(), id: x.id }])); refresh(); }, e => toast('Live sync stopped: ' + (e.message || e.code)));
    cfg.onSnapshot(s => { if (s.exists) S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...s.data() }; refresh(); }, () => {});
  }
  render();
})();
</script>
